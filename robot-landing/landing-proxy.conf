# Shared by the /api/landing/* locations in nginx.conf (included, so the proxy settings exist once).
limit_except GET HEAD {
    deny all;
}

resolver 127.0.0.11 valid=300s ipv6=off; # Docker's embedded DNS (it forwards external names)

proxy_pass $landing_upstream;
proxy_ssl_server_name on;
proxy_ssl_name api.perpixai.ir;
proxy_set_header Host api.perpixai.ir;
proxy_set_header Accept application/json;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_connect_timeout 3s;
proxy_read_timeout 5s;

# Upstream headers that mean nothing to a same-origin client (and a second X-Cache from the CDN).
proxy_hide_header X-Cache;
proxy_hide_header Server-Timing;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;

proxy_cache landing;
proxy_cache_key $uri;
proxy_cache_valid 200 5m;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

# add_header is not inherited once a location sets its own: repeat the security headers.
include /etc/nginx/security-headers.conf;
add_header Cache-Control "public, max-age=60" always;
add_header X-Cache $upstream_cache_status always;
