x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  robot-landing:
    image: robot-landing:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PNPM_VERSION: ${PNPM_VERSION:-11.4.0}
        PACKAGE_REGISTRY: ${PACKAGE_REGISTRY:-https://registry.npmmirror.com}
        VITE_AUTH_URL: ${VITE_AUTH_URL}
        VITE_PHONE_PARAM: ${VITE_PHONE_PARAM}
        VITE_PHONE_FORMAT: ${VITE_PHONE_FORMAT}
        VITE_PREVIEW: ${VITE_PREVIEW}
    ports:
      - "${ROBOT_LANDING_PORT:-5176}:5176"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=755,uid=101,gid=101
      - /var/run:size=4m,mode=755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.20"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:5176/healthz | grep -q ok"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    pull_policy: build
    networks:
      - perpix

  robot-landing-dev:
    image: robot-landing:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PNPM_VERSION: ${PNPM_VERSION:-11.4.0}
        PACKAGE_REGISTRY: ${PACKAGE_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "${ROBOT_LANDING_PORT:-5176}:5176"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev
    networks:
      - perpix

networks:
  perpix:
    external: true

