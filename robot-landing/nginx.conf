# Plans and models for the landing page, proxied from the Perpix API.
# The browser cannot call the API directly (its CORS allows only app.perpixai.ir), so the page asks this same-origin path
# (NEXT_PUBLIC_LANDING_API_URL, default /api/landing). Cached for 5 minutes, and stale data is served when the API errors,
# so landing traffic never reaches the API one request per visitor and an API outage never breaks the page.
proxy_cache_path /var/cache/nginx/landing levels=1:2 keys_zone=landing:1m max_size=5m inactive=1h use_temp_path=off;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # /terms -> /terms/ as a relative redirect: behind a reverse proxy the internal port 8080 must not leak into Location.
    absolute_redirect off;
    charset utf-8;
    etag on;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 1m;
    large_client_header_buffers 2 8k;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/security-headers.conf;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Variables in proxy_pass make nginx resolve the API at request time (through Docker's resolver), so nginx still starts
    # when the API is unreachable. Only these two read-only endpoints are exposed; nothing from the visitor is forwarded.
    location = /api/landing/plans {
        set $landing_upstream https://api.perpixai.ir/api/v1/user/subscription/plans;
        include /etc/nginx/landing-proxy.conf;
    }

    location = /api/landing/models {
        set $landing_upstream https://api.perpixai.ir/api/v1/ai-registry/models;
        include /etc/nginx/landing-proxy.conf;
    }

    location ~ ^/(?:sw|workbox-[^/]+)\.js$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # /landing-assets/_next/static/x.js -> html/_next/static/x.js (assetPrefix in next.config.ts)
    location ^~ /landing-assets/_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Voice lines and demo clips keep their file names when they are re-recorded: revalidate (ETag, 304) instead of a blind 30-day cache.
    location ~ ^/(?:audio|demo)/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, no-cache";
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|otf|wasm|mp4|webm|mp3)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }
}
